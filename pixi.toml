[workspace]
name = "dsh-pet-assets"
description = "素材处理链（绿幕抠像 → 归一化 → 转码）的运行环境"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
scipy = ">=1.11"
pillow = ">=10"
ffmpeg = ">=7"

[tasks]
# 全链路（本地验证用）：桥接 → 抠像 → 归一化 → 缩略图
bridge = "python scripts/bridge_step00.py"
chroma = "python scripts/chroma_step02.py"
normalize = "python scripts/normalize_step03.py"
thumbs = "python scripts/encode_thumbs.py"
